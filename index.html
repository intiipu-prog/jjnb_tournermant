<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>진주 놀방 대진표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#f3f4f6; --card:#fff; --ink:#15171c; --sub:#5d636e; --gray:#9aa0a9; --line:#e3e6ea;
  --red:#e10600; --red2:#b80500; --yel:#ffc400; --blue:#1d6fe0; --green:#12a150; --dark:#14161b;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}
a{color:var(--blue)}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px}

/* header */
header.top{background:var(--dark);color:#fff;position:relative;overflow:hidden}
.banner{display:flex;align-items:center;gap:14px;padding:14px 0 18px}
.banner .logo{height:45px;max-width:46%;display:flex;align-items:center}
.banner .logo img,.banner .logo svg{max-height:45px;max-width:100%;display:block;border-radius:8px}
.banner h1{margin:0;color:#fff;font-size:26px;font-weight:900;letter-spacing:-.5px}
.banner .en{font-size:15px;letter-spacing:2px;color:var(--yel);font-weight:700}
.hstats{margin-left:auto;display:flex;gap:6px;align-self:flex-start;margin-top:2px}
.hstats div{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:4px 9px;text-align:center;min-width:54px}
.hstats b{display:block;font-size:16px;font-weight:900;color:#fff;line-height:1.2}
.hstats span{font-size:10.5px;color:#aeb4bd;white-space:nowrap}
.hstats .lv b{color:#ff6b63}
@media (max-width:520px){.hstats{gap:4px}.hstats div{padding:3px 6px;min-width:44px}.hstats b{font-size:14px}.hstats span{font-size:9.5px}}
.stripe{height:4px;background:linear-gradient(90deg,var(--red) 0 60%,var(--yel) 60% 80%,var(--blue) 80%)}
nav.tabs{background:#1d2027;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.18)}
nav.tabs .wrap{display:flex;align-items:center;gap:8px}
nav.tabs .navs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
nav.tabs .navs::-webkit-scrollbar{display:none}
nav.tabs a.newbtn{flex-shrink:0;background:var(--red);color:#fff;border:0;border-radius:9px;padding:8px 14px;margin:6px 0;font-size:14.5px}
nav.tabs a.newbtn:hover,nav.tabs a.newbtn.on{background:var(--red2);color:#fff}
@media (max-width:520px){nav.tabs a.newbtn{padding:7px 10px;font-size:13.5px}}
nav.tabs a{color:#c9cdd4;text-decoration:none;padding:12px 12px;font-weight:700;font-size:15px;white-space:nowrap;border-bottom:3px solid transparent}
nav.tabs a.on{color:#fff;border-bottom-color:var(--red)}
.modebar{font-size:12.5px;padding:6px 14px;text-align:center;background:#fff4cc;color:#6b5300}
.modebar.ro{background:#e7f0ff;color:#1d4b99}

main{padding:16px 0 60px}
h2.pg{font-size:22px;margin:4px 0 14px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2.pg .sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:17px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 small{font-weight:500;color:var(--sub);font-size:13px}
.card h3 .sp{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:repeat(3,1fr)}}
.muted{color:var(--sub)} .small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}

.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 14px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#c4c9d0}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{background:var(--red2)}
.btn.dark{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.red{background:#fff;border-color:#f3b4b2;color:var(--red)}
.btn.sm{padding:6px 10px;font-size:13.5px;border-radius:8px}
.btn.big{padding:13px 20px;font-size:17px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:#eef0f3;color:var(--sub);white-space:nowrap}
.badge.live{background:#ffe7e6;color:var(--red)}
.badge.done{background:#e3f6ec;color:var(--green)}
.badge.cxl{background:#eceef1;color:#7a808a;text-decoration:line-through}
.badge.tour{background:#e7f0ff;color:var(--blue)}
.badge.pts{background:#fff4cc;color:#8a6a00}

/* names */
.nm{white-space:nowrap}
.pn{font-weight:700}
.nk{color:var(--gray);font-weight:500}
.nk.blue{color:var(--blue)}
.nk.same{color:var(--gray)}

/* stat tiles */
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.tile b{display:block;font-size:26px;font-weight:900}
.tile span{font-size:13px;color:var(--sub)}

/* recent cards */
.dashq{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:14px;margin-bottom:14px;align-items:stretch}
.dashq.one{grid-template-columns:1fr}
@media (max-width:760px){.dashq{grid-template-columns:1fr}}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.tgrid{grid-template-columns:1fr}}
.plgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:900px){.plgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.plgrid{grid-template-columns:1fr}}
.plc{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;min-width:0}
.plc .plm{flex:1;min-width:0}
.plc .pln{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plc .small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.rgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:860px){.rgrid{grid-template-columns:1fr}}
.rc{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;position:relative}
.rc .tt{font-size:18px;font-weight:900;margin:2px 0 4px}
.podium{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin-top:8px;font-size:16px;align-items:center}
.medal{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:#fff}
.m1{background:linear-gradient(135deg,#f7c600,#d99a00)} .m2{background:linear-gradient(135deg,#c5ccd6,#8d96a3)} .m3{background:linear-gradient(135deg,#d99561,#a5622f)} .m4{background:#6b7380}
.mx{background:#c9ced6;color:#333}

/* heats */
.sec{margin-bottom:18px}
.sec>h4{margin:0 0 8px;font-size:17px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec>h4 small{font-weight:500;color:var(--sub);font-size:13px}
.heat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid2 .heat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:760px){.heat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.heat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 10px 6px;min-width:0}
.heat.ok{border-color:#9fdcb9;box-shadow:inset 0 3px 0 var(--green)}
.heat.blue,.heat.blue.ok{background:#f2f7ff;border-color:#8db6f2;box-shadow:inset 0 3px 0 var(--blue)}
.heat.blue .hh>span:first-child{color:var(--blue)}
.heat.final{border-color:#f0c35a;box-shadow:inset 0 3px 0 var(--yel)}
.heat .hh{display:flex;align-items:center;justify-content:space-between;gap:6px;font-weight:900;font-size:15px;margin-bottom:4px}
.hp{padding:7px 0;border-top:1px dashed #eceef1;min-width:0}
.hp:first-of-type{border-top:0}
.hp .nmline{display:flex;align-items:center;gap:6px;min-width:0}
.hp .nm{font-size:clamp(16px,4.6vw,20px);overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.hp.win .pn{color:var(--green)}
.hp.out{opacity:.55}
.hp.rm .nm{text-decoration:line-through;opacity:.5}
.rtag{font-size:12.5px;font-weight:900;padding:2px 7px;border-radius:6px;white-space:nowrap}
.rtag.W{background:#e3f6ec;color:var(--green)} .rtag.L{background:#eef0f3;color:#6b7280} .rtag.D{background:#ffe7e6;color:var(--red)}
.rtag.R{background:#fff4cc;color:#7a5c00}
.dqall{border:1px solid #f3b4b2;background:#fff;color:var(--red);border-radius:7px;padding:3px 7px;font-size:12px;font-weight:700}
.dqall.on{background:var(--red);color:#fff;border-color:var(--red)}
.seg{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.seg button{flex:1;min-width:0;border:1px solid var(--line);background:#f8f9fa;border-radius:7px;padding:5px 2px;font-size:13px;font-weight:700;color:#4b515b}
.seg button.on.W{background:var(--green);border-color:var(--green);color:#fff}
.seg button.on.L{background:#6b7280;border-color:#6b7280;color:#fff}
.seg button.on.D{background:var(--red);border-color:var(--red);color:#fff}
.seg button.on.R{background:var(--yel);border-color:#e0ab00;color:#222}
.seg button.on.E{background:var(--red);border-color:var(--red);color:#fff}
.flow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#f8f9fb;border:1px dashed #cfd4da;border-radius:12px;padding:12px;margin:6px 0 18px}
.flow .msg{flex:1;min-width:200px;font-weight:700}
.fin-list{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:15px}
.chip.gold{border-color:#f0c35a;background:#fffaf0}

.ttabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 14px;padding-bottom:2px;scrollbar-width:none}
.ttabs::-webkit-scrollbar{display:none}
.ttabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-weight:700;font-size:15px;white-space:nowrap;color:var(--sub)}
.ttabs button.on{background:var(--dark);border-color:var(--dark);color:#fff}
.ttabs button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-left:5px;vertical-align:middle}

/* tables */
table.tb{width:100%;border-collapse:collapse;font-size:15px}
table.tb th{font-size:13px;color:var(--sub);font-weight:700;text-align:left;padding:8px 6px;border-bottom:2px solid var(--line);white-space:nowrap}
table.tb th.sth{cursor:pointer;user-select:none}
table.tb th.sth:hover,table.tb th.sth.on{color:var(--ink)}
table.tb th.sth .arw{font-size:10px;margin-left:4px;opacity:.7}
table.tb td{padding:9px 6px;border-bottom:1px solid #eef0f2;vertical-align:middle}
table.tb td.num,table.tb th.num{text-align:center}
.tbwrap{overflow-x:auto}

/* matrix */
.mx-wrap{overflow:auto;max-width:100%;border:1px solid var(--line);border-radius:12px;background:#fff}
table.mtx{border-collapse:separate;border-spacing:0;font-size:14px}
table.mtx th,table.mtx td{border-right:1px solid #eef0f2;border-bottom:1px solid #eef0f2;text-align:center;padding:0;min-width:46px;height:40px}
table.mtx th{background:#f6f7f9;font-weight:900;color:var(--sub);position:sticky;top:0;z-index:2}
table.mtx th.rh,table.mtx td.rh{position:sticky;left:0;background:#fff;z-index:1;text-align:left;padding:0 10px;min-width:150px;white-space:nowrap}
table.mtx th.rh{z-index:3;background:#f6f7f9}
table.mtx td.rh .nm{font-size:16px}
table.mtx td.c{cursor:default;font-weight:900}
table.mtx td.c.ed{cursor:pointer}
table.mtx td.c.ed:hover{outline:2px solid var(--blue);outline-offset:-2px}
table.mtx td.self{background:repeating-linear-gradient(45deg,#f1f2f4 0 6px,#e7e9ec 6px 12px)}
td.W{background:#e3f6ec;color:var(--green)} td.L{background:#f3f4f6;color:#6b7280} td.D{background:#ffe7e6;color:var(--red)} td.DD{background:#ffd6d4;color:var(--red2)} td.N{color:#c3c7cd}
td.tot{font-weight:900;background:#fffaf0}

/* forms */
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fld label{font-size:13px;font-weight:700;color:var(--sub)}
.fld input,.fld select,.fld textarea{border:1px solid #d5d9df;border-radius:10px;padding:10px 12px;background:#fff;width:100%}
.opt{display:flex;gap:6px;flex-wrap:wrap}
.opt button{border:1px solid #d5d9df;background:#fff;border-radius:10px;padding:9px 14px;font-weight:700;font-size:15px;color:var(--sub)}
.opt button.on{background:var(--dark);border-color:var(--dark);color:#fff}
.cfcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.cfgrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:14px;margin-bottom:14px;align-items:start}
@media (max-width:760px){.cfgrow{grid-template-columns:1fr}}
.setrow{display:flex;gap:14px;align-items:flex-start}
.setrow .fld{flex-shrink:0;margin-bottom:10px}
.setrow .opt{flex-wrap:nowrap;gap:4px}
.setrow .opt button{padding:7px 10px;font-size:14px}
@media (max-width:520px){.setrow{gap:8px}.setrow .opt button{padding:6px 7px;font-size:13px}.setrow .lg{display:none}.setrow .fld label{font-size:12px}}
.dtrow{display:flex;gap:10px;align-items:flex-start}
.dtrow .opt{flex-wrap:nowrap}
@media (max-width:420px){.dtrow{gap:6px}.dtrow .opt button{padding:9px 9px;font-size:14px}}
.pick{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.pick label{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #f0f1f3;cursor:pointer;font-size:18px}
#nf-pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start}
#nf-pick label{border-right:1px solid #f0f1f3;min-width:0;padding:10px 10px;font-size:17px}
#nf-pick label:last-child{border-bottom:1px solid #f0f1f3}
#nf-pick label .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
#nf-pick .empty{grid-column:1/-1}
.pick label:last-child{border-bottom:0}
.pick input{width:20px;height:20px;accent-color:var(--red)}
.pick label.sel{background:#fff7f6}

/* QR */
.qrbox{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.qr{background:#fff;padding:8px;border-radius:10px;border:1px solid var(--line);line-height:0}
.qr img,.qr canvas{display:block}
.comm{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.comm .qrbox b{font-size:15px}

/* modal */
#modal{position:fixed;inset:0;background:rgba(10,12,16,.55);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:5vh 12px;overflow:auto}
#modal.on{display:flex}
.mbox{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:560px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.mbox h3{margin:0 0 12px;font-size:19px;font-weight:900}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.ask{font-size:17px;font-weight:500;margin:4px 0 0;white-space:pre-line}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:#1b1e24;color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;font-size:15px;opacity:0;transition:.25s;z-index:200;max-width:90vw;text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.banner-cxl{background:#eceef1;border-radius:12px;padding:12px 14px;font-weight:700;color:#5b616b;margin-bottom:14px}
.empty{text-align:center;color:var(--sub);padding:28px 10px}
.rgrid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:8px}
.rg{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:9px 10px;background:#fff;min-width:0}
.rg .nmw{min-width:0;overflow:hidden;text-overflow:ellipsis}
.rg .nm{font-size:clamp(14px,3.8vw,17px)}
.rg.top{flex-direction:column;text-align:center;padding:14px 8px;gap:6px}
.rg.top .medal{width:40px;height:40px;font-size:18px}
.rg.top .nm{font-size:clamp(17px,5vw,24px);white-space:normal}
.rg.top .nk{display:block}
.rg.t1{background:linear-gradient(180deg,#fff7d6,#fff);border-color:#f0c35a}
.rg.t2{background:linear-gradient(180deg,#f1f3f6,#fff);border-color:#c5ccd6}
.rg.t3{background:linear-gradient(180deg,#fbeee3,#fff);border-color:#d99561}
.topgrid{margin-bottom:12px}
@media (max-width:520px){.rg{padding:7px 6px;gap:5px}.rg .medal{width:24px;height:24px;font-size:11px}.rg.top .medal{width:34px;height:34px;font-size:15px}}
.rank-list .ri{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid #eef0f2}
.rank-list .ri .rk{width:44px;text-align:center;font-weight:900;font-size:18px}
.rank-list .ri .nm{font-size:20px}
.rank-list .ri.top{background:linear-gradient(90deg,#fffaf0,transparent)}
.mv{display:inline-flex;gap:2px}
.mv button{border:1px solid var(--line);background:#fff;border-radius:6px;width:28px;height:26px;font-size:12px;color:var(--sub)}
@media (max-width:520px){
  .banner h1{font-size:21px}
  .banner .logo{height:35px}
  .banner .logo img,.banner .logo svg{max-height:35px}
  .heat-grid{gap:7px}
  .heat{padding:8px 7px 5px}
  .seg button{font-size:12px;padding:5px 1px}
  .card{padding:13px}
  h2.pg{font-size:20px}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap banner">
    <div class="logo" id="logo"></div>
    <div>
      <h1>진주 놀방 대진표</h1>
    </div>
    <div class="hstats" id="hstats"></div>
  </div>
</header>
<div class="stripe"></div>
<nav class="tabs"><div class="wrap" id="nav"></div></nav>
<div id="modebar"></div>
<main><div class="wrap" id="app"><div class="empty">불러오는 중…</div></div></main>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ================= 기본 설정 ================= */
const DEFAULT_APP_URL = "https://claude.ai/artifact/LGx4SbSjHoPNYNhAGWWMUJ";
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCYQlZ-GRN4WZyYK_FWi91BgTE4ZgpCvhQ",
  authDomain: "jjnb-tournament.firebaseapp.com",
  projectId: "jjnb-tournament",
  storageBucket: "jjnb-tournament.firebasestorage.app",
  messagingSenderId: "218279847486",
  appId: "1:218279847486:web:00fe7d8a6a77208d2bd36f"
};
const FB_VER = "10.12.2";
function useFirebase(){return /github\.io$/i.test(location.hostname)||/[?&]fb=1\b/.test(location.search);}
const BAND_URL = "https://band.us/@sip";
const KAKAO_URL = "https://open.kakao.com/o/gQQFAi1g";

const S = {
  players: [], settings: {}, tours: {},
  loaded: { players:false, settings:false, tours:false },
  mode: 'init', canWrite: true, viewOnly: false,
  tab: {}, newForm: null, _ask: null
};

/* ================= 유틸 ================= */
const $ = s => document.querySelector(s);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function chunk(a,n){const r=[];for(let i=0;i<a.length;i+=n)r.push(a.slice(i,i+n));return r;}
function clone(o){return JSON.parse(JSON.stringify(o));}

/* ================= 저장소 (백엔드 DB / 로컬 대체) ================= */
let DB=null;
const pend={}, infl={};
function queueWrite(path,data){pend[path]={data};if(!infl[path])flush(path);}
function queueDelete(path){pend[path]={del:true};if(!infl[path])flush(path);}
async function flush(path){
  infl[path]=true;
  while(pend[path]){
    const job=pend[path];delete pend[path];
    try{
      if(DB){
        const ref=DB.doc(path);
        if(job.del) await ref.delete(); else await ref.set(job.data);
      }else{
        const k='jjnb:'+path;
        try{ if(job.del) localStorage.removeItem(k); else localStorage.setItem(k,JSON.stringify(job.data)); }catch(e){}
      }
    }catch(e){ writeError(e); }
  }
  infl[path]=false;
}
function writeError(e){
  const code=e&&e.code;
  if(code==='permission-denied'||code==='unauthenticated'){toast('진행자 로그인이 필요합니다 (저장되지 않았습니다)');return;}
  if(code==='invalid_argument'){S.canWrite=false;renderShell();render();toast('편집 권한이 없어 저장되지 않았습니다 (보기 전용)');}
  else if(code==='quota_exceeded'){toast('저장 공간이 가득 찼습니다. 오래된 대회를 정리해 주세요.');}
  else if(code==='unavailable'){toast('서버 연결이 불안정합니다. 잠시 후 다시 시도하세요.');}
  else toast('저장 실패: '+((e&&e.message)||code||'알 수 없는 오류'));
}
function savePlayers(list){S.players=list;render(true);queueWrite('app/players',{json:JSON.stringify(list),updatedAt:Date.now()});ghSchedule();}
function saveSettings(s){S.settings=s;renderShell();render(true);queueWrite('app/settings',{json:JSON.stringify(s),updatedAt:Date.now()});}
function saveTour(t){t.updatedAt=Date.now();S.tours[t.id]=t;render(true);queueWrite('tournaments/'+t.id,{json:JSON.stringify(t),updatedAt:t.updatedAt});ghSchedule();}
function delTour(id){delete S.tours[id];render(true);queueDelete('tournaments/'+id);ghSchedule();}

function subscribeAll(){
    const slow=setTimeout(()=>{if(!S.loaded.tours){toast('서버 응답이 늦습니다. 연결을 확인 중…');}},10000);
    DB.doc('app/players').onSnapshot(s=>{S.players=s.exists?parseJ(s.data().json,[]):[];S.loaded.players=true;render(true);},onSnapErr);
    DB.doc('app/settings').onSnapshot(s=>{S.settings=s.exists?parseJ(s.data().json,{}):{};S.loaded.settings=true;renderShell();render(true);},onSnapErr);
    DB.collection('tournaments').onSnapshot(qs=>{
      clearTimeout(slow);
      const m={};qs.docs.forEach(d=>{const t=parseJ((d.data()||{}).json,null);if(t&&t.id)m[d.id]=t;});
      S.tours=m;S.loaded.tours=true;render(true);
    },onSnapErr);
}
async function initFirebase(){
  const b='https://www.gstatic.com/firebasejs/'+FB_VER+'/';
  await loadScript(b+'firebase-app-compat.js');
  await loadScript(b+'firebase-auth-compat.js');
  await loadScript(b+'firebase-firestore-compat.js');
  firebase.initializeApp(FIREBASE_CONFIG);
  const fs=firebase.firestore();
  DB={doc:p=>fs.doc(p),collection:p=>fs.collection(p)};
  S.mode='fb';S.canWrite=false;
  firebase.auth().onAuthStateChanged(u=>{S.fbUser=u||null;S.canWrite=!!u;renderShell();render(true);});
  subscribeAll();
}
async function initStore(){
  if(useFirebase()){
    try{await initFirebase();renderShell();render();return;}
    catch(e){console.error(e);toast('Firebase 연결 실패: '+(e&&e.message||e)+' · 로컬 모드로 실행합니다');}
  }
  let db=null;
  try{ db=await getCap('db'); }catch(e){ db=null; }
  if(db){
    DB=db; S.mode='db';
    try{const u=await getCap('user'); if(u&&u.can){const c=await u.can('data.write'); if(c===false) S.canWrite=false;}}catch(e){}
    subscribeAll();
  }else{
    S.mode='local';
    const g=k=>{try{const v=localStorage.getItem('jjnb:'+k);return v?JSON.parse(v):null;}catch(e){return null;}};
    const p=g('app/players');S.players=p?parseJ(p.json,[]):[];
    const st=g('app/settings');S.settings=st?parseJ(st.json,{}):{};
    try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('jjnb:tournaments/')===0){const v=JSON.parse(localStorage.getItem(k));const t=parseJ(v.json,null);if(t)S.tours[t.id]=t;}}}catch(e){}
    S.loaded={players:true,settings:true,tours:true};
  }
  renderShell();render();
}
function onSnapErr(e){
  if(e&&e.code==='permission-denied'){toast('데이터를 읽을 권한이 없습니다. Firestore 규칙을 확인하세요.');return;}
  if(e&&e.code==='revoked'){S.canWrite=false;toast('접근 권한이 변경되었습니다');}
  else toast('데이터 연결 오류: '+((e&&e.message)||(e&&e.code)||''));
}

/* ================= 대진 엔진 공통 ================= */
function newHeat(players){return {id:uid(),players:players.slice(),res:{}};}
function isActive(t,p){return !(t.removed||[]).includes(p);}
function activeList(t){return t.active.filter(p=>isActive(t,p));}
function act(t,h){return h.players.filter(p=>isActive(t,p));}
function resolved(t,h){return act(t,h).every(p=>h.res[p]!=null);}
function winners(t,h){return act(t,h).filter(p=>h.res[p]==='W');}
function losers(t,h){return act(t,h).filter(p=>h.res[p]==='L'||h.res[p]==='D');}
function rankOrder(t,h){const a=act(t,h);return {ranked:a.filter(p=>typeof h.res[p]==='number').sort((x,y)=>h.res[x]-h.res[y]),dq:a.filter(p=>h.res[p]==='D')};}
function stageDone(t,st){return st.heats.every(h=>resolved(t,h));}
function hasRes(h){return h&&Object.keys(h.res||{}).length>0;}
function makeGroups(ids,size){
  ids=shuffle(ids);const n=ids.length;if(!n)return [];
  if(size===2){const g=chunk(ids,2);if(g.length>1&&g[g.length-1].length===1){const l=g.pop();g[g.length-1].push(l[0]);}return g;}
  const g=chunk(ids,3);
  if(g.length>1&&g[g.length-1].length===1){const l=g.pop(),p=g.pop();const f=p.concat(l);g.push(f.slice(0,2),f.slice(2));}
  return g;
}
/* 체인: 조별(adv) 단계 → 3명 이하가 되면 순위전(rank) */
function chainStart(t,pool,size,N){
  pool=pool.filter(p=>isActive(t,p));
  const ch={size,N:N||null,stages:[],done:false,result:[]};
  if(!pool.length){ch.done=true;return ch;}
  if(N&&pool.length<=N){ch.done=true;ch.result=pool.slice();return ch;}
  if(pool.length<=3)ch.stages.push({kind:'rank',heats:[newHeat(pool)]});
  else ch.stages.push({kind:'adv',heats:makeGroups(pool,size).map(newHeat)});
  return ch;
}
function chainAdvance(t,ch){
  if(!ch||ch.done)return;
  const last=ch.stages[ch.stages.length-1];if(!last||!stageDone(t,last))return;
  if(last.kind==='rank'){ch.done=true;ch.result=rankOrder(t,last.heats[0]).ranked;return;}
  const w=last.heats.flatMap(h=>winners(t,h));
  if(!w.length){ch.done=true;ch.result=[];return;}
  if(ch.N&&w.length<=ch.N){ch.done=true;ch.result=w;return;}
  if(w.length<=3){ch.stages.push({kind:'rank',heats:[newHeat(w)]});return;}
  ch.stages.push({kind:'adv',heats:makeGroups(w,ch.size).map(newHeat)});
}
function chainHasRes(ch){return !!ch&&ch.stages.some(s=>s.heats.some(hasRes));}

/* ================= 토너먼트 ================= */
function roundFinalists(t,r){
  const m=r.main;if(!m||!m.done)return [];
  const last=m.stages[m.stages.length-1];let res;
  if(last&&last.kind==='rank')res=rankOrder(t,last.heats[0]).ranked.slice(0,m.N||2);else res=m.result||[];
  return res.filter(p=>isActive(t,p));
}
function allFinalists(t){const o=[];(t.rounds||[]).forEach(r=>roundFinalists(t,r).forEach(p=>{if(!o.includes(p))o.push(p);}));return o;}
function nextPool(t){const f=allFinalists(t);return activeList(t).filter(p=>!f.includes(p));}
function startRound(t){
  const pool=nextPool(t);
  if(!pool.length){toast('다음 라운드에 참가할 선수가 없습니다');return false;}
  const prev=t.rounds[t.rounds.length-1]||{};
  const size=prev.size||t.opt.qualSize||3,repSize=prev.repSize||size,mainSize=prev.mainSize||t.opt.mainSize||3;
  t.rounds.push({no:t.rounds.length+1,size,repSize,mainSize,qual:{heats:makeGroups(pool,size).map(newHeat)},rep:null,main:null,qualCount:t.opt.qualCount||2});
  return true;
}
function qualWinners(t,r){return r.qual.heats.flatMap(h=>winners(t,h));}
function qualLosers(t,r){return r.qual.heats.flatMap(h=>losers(t,h));}
function finalsUpperHeat(f){const u=f&&f.upper;if(!u)return null;const l=u.stages[u.stages.length-1];return l&&l.kind==='rank'?l.heats[0]:null;}
function finalsProgress(t){
  const f=t.finals;if(!f)return false;
  if(f.stage1&&!f.upper&&stageDone(t,f.stage1)){
    const w=f.stage1.heats.flatMap(h=>winners(t,h)),l=f.stage1.heats.flatMap(h=>losers(t,h));
    f.upper=chainStart(t,w,f.size,null);f.lower=l.length?chainStart(t,l,f.size,null):null;
  }
  if(f.upper)chainAdvance(t,f.upper);
  if(f.lower)chainAdvance(t,f.lower);
  return !!(f.upper&&f.upper.done&&(!f.lower||f.lower.done));
}
function finalRanking(t){
  const f=t.finals;const out=[];let rk=1;
  const take=ch=>{if(!ch)return;const l=ch.stages[ch.stages.length-1];if(!l||l.kind!=='rank')return;const h=l.heats[0];const ro=rankOrder(t,h);ro.ranked.concat(ro.dq).forEach(p=>out.push({pid:p,rank:rk++,dq:h.res[p]==='D'}));};
  take(f.upper);take(f.lower);
  const seen=new Set(out.map(o=>o.pid));
  allFinalists(t).forEach(p=>{if(!seen.has(p)&&isActive(t,p))out.push({pid:p,rank:null});});
  return out;
}
function snapResult(t,list){return list.map(o=>({pid:o.pid,rank:o.rank,dq:!!o.dq,name:(t.people[o.pid]||{}).name||'',nick:(t.people[o.pid]||{}).nick||''}));}
function autoProgress(t){
  if(t.type==='tournament'){
    const R=t.rounds[t.rounds.length-1];
    if(R&&R.main&&!R.main.done)chainAdvance(t,R.main);
    if(t.finals){
      const done=finalsProgress(t);
      if(done){t.result=snapResult(t,finalRanking(t));if(t.status==='active')t.status='done';}
      else{if(t.status==='done')t.status='active';t.result=null;}
    }
  }else if(t.type==='points'){
    svProgress(t);
  }
}

/* ================= 포인트전 ================= */
const PTS={W:2,L:1,D:0};
function mkey(a,b){return a<b?a+'|'+b:b+'|'+a;}
function standings(t){
  const P=t.pts,ps=activeList(t);
  const st={};ps.forEach(p=>st[p]={pid:p,pts:0,w:0,l:0,d:0,g:0});
  Object.keys(P.res).forEach(k=>{const r=P.res[k];const [a,b]=k.split('|');if(!st[a]||!st[b])return;[a,b].forEach(p=>{const v=r[p];if(!v)return;st[p].g++;st[p].pts+=PTS[v];if(v==='W')st[p].w++;else if(v==='L')st[p].l++;else st[p].d++;});});
  const mo=P.tie||[];
  return Object.values(st).sort((x,y)=>{
    if(y.pts!==x.pts)return y.pts-x.pts;
    const ix=mo.indexOf(x.pid),iy=mo.indexOf(y.pid);
    if(ix>=0&&iy>=0&&ix!==iy)return ix-iy;
    if(ix>=0&&iy<0)return -1; if(iy>=0&&ix<0)return 1;
    if(y.w!==x.w)return y.w-x.w;
    return ((t.people[x.pid]||{}).name||'').localeCompare((t.people[y.pid]||{}).name||'','ko');
  });
}
function totalMatches(t){const n=activeList(t).length;return n*(n-1)/2;}
function playedMatches(t){const ps=new Set(activeList(t));return Object.keys(t.pts.res).filter(k=>{const [a,b]=k.split('|');return ps.has(a)&&ps.has(b);}).length;}
function svRemaining(t){const P=t.pts;const el=new Set(P.heats.flatMap(h=>h.elim));return (P.seeds||[]).filter(p=>isActive(t,p)&&!el.has(p));}
function svNeed(t,h){return Math.min(h.elimCount,Math.max(0,act(t,h).length-1));}
function svHeatDone(t,h){const e=h.elim.filter(p=>isActive(t,p)).length;return e>=svNeed(t,h);}
function svProgress(t){
  const P=t.pts;if(!P||!P.seeds)return;
  if(!P.final){
    const last=P.heats[P.heats.length-1];
    if(!last||svHeatDone(t,last)){
      const rem=svRemaining(t);
      if(rem.length<=3){if(rem.length)P.final={id:uid(),players:rem,res:{}};}
      else P.heats.push({id:uid(),players:rem.slice(-3),R:rem.length,elimCount:1,elim:[]});
    }
  }
  if(P.final&&resolved(t,P.final)){t.result=snapResult(t,svRanking(t));if(t.status==='active')t.status='done';}
  else{if(t.status==='done')t.status='active';t.result=null;}
}
function svRanking(t){
  const P=t.pts;const out=[];
  if(P.final){const ro=rankOrder(t,P.final);let rk=1;ro.ranked.concat(ro.dq).forEach(p=>out.push({pid:p,rank:rk++,dq:P.final.res[p]==='D'}));}
  const el=[];P.heats.forEach(h=>h.elim.forEach((p,i)=>{if(isActive(t,p))el.push({pid:p,rank:h.R-i});}));
  el.sort((a,b)=>a.rank-b.rank);
  return out.concat(el);
}

function render(fromData){
  const r=route();
  if(fromData&&(r==='new'||r==='config'))return;
  if(S.mode==='init')return;
  const app=$('#app');
  let html='';
  try{
    if(r==='dash')html=vDash();
    else if(r==='tours')html=vTours();
    else if(r==='new')html=canEdit()?vNew():vDash();
    else if(r==='players')html=vPlayers();
    else if(r==='hof')html=vHof();
    else if(r==='config')html=vConfig();
    else if(r.indexOf('t-')===0)html=vTour(r.slice(2));
    else html=vDash();
  }catch(e){console.error(e);html=`<div class="card">화면 오류: ${esc(e.message)}</div>`;}
  app.innerHTML=html;
  const all=Object.values(S.tours);
  $('#hstats').innerHTML=`<div><b>${S.players.length}</b><span>등록 선수</span></div><div><b>${all.filter(t=>t.status!=='cancelled').length}</b><span>전체 대회</span></div><div class="lv"><b>${all.filter(t=>t.status==='active').length}</b><span>진행중</span></div>`;
  drawQRs(app);
  if(r==='players')applyPlayerFilter();
  if((r==='players'||r==='tours')&&canEdit()&&!window.XLSX)needXLSX().catch(()=>{});
}
function drawQRs(root){
  root.querySelectorAll('[data-qr]').forEach(el=>{
    const txt=el.getAttribute('data-qr');const sz=+el.getAttribute('data-sz')||120;
    if(!txt){el.innerHTML='<span class="small muted">링크 미설정</span>';return;}
    el.innerHTML='';
    if(window.QRCode){try{new QRCode(el,{text:txt,width:sz,height:sz,correctLevel:QRCode.CorrectLevel.M});}catch(e){el.textContent='QR 오류';}}
    else el.innerHTML='<span class="small muted">QR 로딩 실패</span>';
  });
}

function progressText(t){
  if(t.status==='cancelled')return '취소된 대회';
  if(t.type==='record')return '기록';
  if(t.type==='points'){const P=t.pts;if(!P.seeds)return `리그 ${playedMatches(t)}/${totalMatches(t)} 경기`;if(P.final&&!resolved(t,P.final))return '결승 진행중';return `본선 서바이벌 진행중 (잔여 ${svRemaining(t).length}명)`;}
  if(t.finals)return '결승라운드 진행중';
  const n=t.rounds.length;return n?`${n}라운드 진행중 / 총 ${t.opt.rounds}라운드`:'준비중';
}
function podiumHTML(t,max){

function segBtns(list,cur,attrs){return `<div class="seg">${list.map(o=>`<button class="${o[2]||o[0]} ${cur===o[0]?'on':''}" data-v="${o[0]}" ${attrs}>${o[1]}</button>`).join('')}</div>`;}
function heatCard(t,h,title,o){
  // o: {kind:'adv'|'rank', ed, offset, ctx(attr string), cls}
  const isRank=o.kind==='rank';const done=resolved(t,h);
  const n=act(t,h).length;const off=o.offset||1;
  const rows=h.players.map(pid=>{
    const rm=!isActive(t,pid);const v=h.res[pid];
    let right='',cls='';
    if(rm){cls='rm';right='<span class="rtag L">제외</span>';}
    else if(!isRank){
      cls=v==='W'?'win':(v?'out':'');
      if(!o.ed&&v)right=`<span class="rtag ${v}">${v==='W'?'진출':v==='L'?'탈락':'실격'}</span>`;
    }else{
      cls=v===1?'win':'';
      if(!o.ed&&v!=null)right=v==='D'?'<span class="rtag D">실격</span>':`<span class="rtag R">${v+off-1}위</span>`;
    }
    let ctrl='';
    if(o.ed&&!rm){
      const at=`data-act="res" data-h="${h.id}" data-p="${pid}" ${o.ctx}`;
      if(!isRank)ctrl=segBtns([['W','진출'],['L','탈락'],['D','실격']],v,at);
      else{const l=[];for(let i=1;i<=n;i++)l.push([i,(i+off-1)+'위','R']);l.push(['D','실격']);ctrl=segBtns(l,v,at);}
    }
    return `<div class="hp ${cls}"><div class="nmline">${tn(t,pid)}${right}</div>${ctrl}</div>`;
  }).join('');
  const allD=n>0&&act(t,h).every(p=>h.res[p]==='D');
  const dqBtn=o.ed&&n?`<button class="dqall ${allD?'on':''}" data-act="res" data-h="${h.id}" data-p="*" data-v="D" ${o.ctx}>${allD?'전체실격 ✓':'전체실격'}</button>`:'';
  return `<div class="heat ${o.cls||''} ${done&&n?'ok':''}"><div class="hh"><span>${title}</span><span class="row" style="gap:4px">${dqBtn}${done&&n?(allD?'<span class="badge" style="background:#ffe7e6;color:var(--red)">전원실격</span>':'<span class="badge done">완료</span>'):'<span class="badge">진행</span>'}</span></div>${rows}</div>`;
}
function vTournament(t,ed){
  const tabs=t.rounds.map((r,i)=>['r'+i,`${r.no}라운드`]);
  if(t.finals||(t.rounds.length&&t.rounds.length>=t.opt.rounds&&roundDone(t,t.rounds[t.rounds.length-1])))tabs.push(['fin','결승라운드']);
  if(t.result)tabs.push(['res','최종 결과']);
  let cur=S.tab[t.id];
  if(!cur||!tabs.some(x=>x[0]===cur))cur=t.result?'res':(t.finals?'fin':(tabs.length?tabs[tabs.length-1][0]:''));
  const live=t.result?'res':t.finals?'fin':'r'+(t.rounds.length-1);
  let h=`<div class="ttabs">${tabs.map(x=>`<button class="${cur===x[0]?'on':''}" data-act="ttab" data-t="${t.id}" data-v="${x[0]}">${x[1]}${x[0]===live&&t.status==='active'?'<span class="dot"></span>':''}</button>`).join('')}</div>`;
  if(cur==='res')return h+`<div class="card"><h3>🏁 최종 결과</h3>${rankGridHTML(t,t.result)}${otherParticipants(t)}</div>`;
  if(cur==='fin')return h+vFinals(t,ed);
  const ri=+cur.slice(1);return h+vRound(t,ri,ed);
}
function roundDone(t,r){return !!(r&&r.main&&r.main.done);}
function rctx(t,ri,kind,si){return `data-t="${t.id}" data-r="${ri}" data-k="${kind}"${si!=null?` data-s="${si}"`:''}`;}
function vRound(t,ri,ed){
  const r=t.rounds[ri];if(!r)return '';
  const isCur=ri===t.rounds.length-1&&!t.finals;const e=ed&&isCur;
  const szSel=(k,cur)=>`<span class="opt">${[3,2].map(n=>`<button class="${cur===n?'on':''}" style="padding:5px 10px;font-size:13px" data-act="setSize" ${rctx(t,ri,k)} data-v="${n}">${n}인 1조</button>`).join('')}</span>`;

const MIME={xlsx:['application/vnd.openxmlformats-officedocument.spreadsheetml.sheet','엑셀 파일'],csv:['text/csv','CSV 파일'],png:['image/png','PNG 이미지']};
/* 저장 위치 선택 (PC 크롬·엣지): 클릭 직후 호출해야 함. 반환: handle | 'cancel' | null(미지원) */
async function pickSave(name){
  if(S.mode==='db'||typeof window.showSaveFilePicker!=='function')return null;
  const ext=(name.split('.').pop()||'').toLowerCase();const m=MIME[ext];
  try{return await window.showSaveFilePicker({suggestedName:name,types:m?[{description:m[1],accept:{[m[0]]:['.'+ext]}}]:undefined});}
  catch(e){if(e&&e.name==='AbortError')return 'cancel';return null;}
}
async function saveFile(name,data,handle){
  if(handle==='cancel')return;
  if(handle&&handle.createWritable){
    try{const w=await handle.createWritable();await w.write(data instanceof Blob?data:new Blob([data]));await w.close();toast(`저장했습니다: ${handle.name}`);return;}
    catch(e){toast('지정한 위치에 저장하지 못해 기본 다운로드로 저장합니다');}
  }
  const dl=S.mode==='db'?await getCap('downloads'):null;
  if(!dl){
    try{const blob=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);toast('파일을 저장했습니다');}
    catch(e){toast('이 화면에서는 파일 저장이 지원되지 않습니다');}
    return;
  }
  try{await dl.save({filename:name,data});toast('파일을 저장했습니다');}
  catch(e){if(e&&e.code==='declined')return;toast('저장 실패: '+((e&&e.message)||(e&&e.code)||''));}
}

function parseEntrants(txt){
  const toks=txt.split(/[\r\n,\t;]+/).map(x=>x.trim()).filter(Boolean);
  const seen=new Set();const out=[];
  toks.forEach(x=>{
    x=x.replace(/^\d+[.)]\s*/,'');if(!x)return;
    let name=x,nick='';
    const m=x.match(/^(.+?)\s*[(（](.+?)[)）]$/);
    if(m){name=m[1].trim();nick=m[2].trim();}else if(x.indexOf('/')>=0){const f=x.split('/');name=f[0].trim();nick=f.slice(1).join('/').trim();}
    const k=name+'|'+nick;if(seen.has(k))return;seen.add(k);out.push({raw:x,name,nick});
  });
  return out;
}
function matchEntrant(e){
  const P=S.players;
  if(e.nick){return P.find(p=>p.name===e.name&&p.nick===e.nick)||P.find(p=>p.nick===e.nick)||null;}
  const byName=P.filter(p=>p.name===e.name);if(byName.length)return byName[0];
  const byNick=P.filter(p=>p.nick===e.name);if(byNick.length)return byNick[0];
  return null;
}

}

  const rawD=(($('#nf-date')||{}).value||'').trim();const nd=rawD?normDate(rawD):(F.date||today());if(!nd){toast('일자를 확인하세요 (예: 2026-11-22)');return;}F.date=nd;
  const t={id:uid(),name:F.name.trim(),date:nd,type:F.type,status:'active',createdAt:Date.now(),people,active:sel.slice(),removed:[],result:null};
  if(F.type==='tournament'){const sz=F.size||3;t.opt={rounds:F.rounds,qualCount:F.qualCount,qualSize:sz,mainSize:sz,finalSize:sz};t.rounds=[];t.finals=null;startRound(t);}
  else{t.pts={res:{},tie:[],seeds:null,heats:[],final:null};}
  S.newForm=null;saveTour(t);go('t-'+t.id);toast('대회가 생성되었습니다');
};

/* 결과 입력 (토너먼트) */
function locate(t,d){
  const k=d.k;
  if(k==='svf')return {heat:t.pts.final,kind:'rank'};
  if(k==='qual'||k==='rep'||k==='main'){
    const r=t.rounds[+d.r];
    if(k==='main'){const st=r.main.stages[+d.s];return {round:r,ri:+d.r,stage:st,si:+d.s,chain:r.main,kind:st.kind};}
    return {round:r,ri:+d.r,stage:r[k],kind:'adv'};
  }
  const f=t.finals;
  if(k==='f1')return {stage:f.stage1,kind:'adv'};
  const ch=k==='up'?f.upper:f.lower;const st=ch.stages[+d.s];return {stage:st,si:+d.s,chain:ch,kind:st.kind};
}
function setVal(t,h,pid,v,kind){
  if(pid==='*'){const a=act(t,h);const all=a.length&&a.every(p=>h.res[p]==='D');a.forEach(p=>{if(all)delete h.res[p];else h.res[p]='D';});return;}
  if(h.res[pid]===v){delete h.res[pid];return;}
  if(kind==='adv'){
    const firstW=v==='W'&&!act(t,h).some(p=>h.res[p]==='W');
    h.res[pid]=v;
    if(firstW)act(t,h).forEach(p=>{if(p!==pid&&h.res[p]==null)h.res[p]='L';});
  }else{
    if(typeof v==='number')act(t,h).forEach(p=>{if(p!==pid&&h.res[p]===v)delete h.res[p];});
    h.res[pid]=v;
    const ap=act(t,h);const un=ap.filter(p=>h.res[p]==null);
    if(un.length===1){const used=ap.map(p=>h.res[p]).filter(x=>typeof x==='number');const dq=ap.filter(p=>h.res[p]==='D').length;for(let i=1;i<=ap.length-dq;i++){if(!used.includes(i)){h.res[un[0]]=i;break;}}}
  }
}
ACT.res=async d=>{
  const t=T(d);let v=d.v;if(/^\d+$/.test(v))v=+v;
  if(d.k==='svf'){
    const P=t.pts;setVal(t,P.final,d.p,v,'rank');autoProgress(t);saveTour(t);return;
  }
  const L=locate(t,d);
  const heat=L.stage.heats.find(x=>x.id===d.h);if(!heat)return;
  // 하위 단계 영향 처리
  let reset=null,hasDown=false;
  if(d.k==='qual'){const r=L.round;if(r.rep||r.main){hasDown=true;reset=()=>{r.rep=null;r.main=null;};}}
  else if(d.k==='rep'){const r=L.round;if(r.main){hasDown=true;reset=()=>{r.main=null;};}}
  else if(d.k==='main'||d.k==='up'||d.k==='low'){const ch=L.chain;if(L.si<ch.stages.length-1||ch.done){hasDown=L.si<ch.stages.length-1;reset=()=>{ch.stages.splice(L.si+1);ch.done=false;ch.result=[];};}}
  else if(d.k==='f1'){const f=t.finals;if(f.upper||f.lower){hasDown=true;reset=()=>{f.upper=null;f.lower=null;};}}
  if(hasDown&&reset){
    const msg=d.k==='qual'?'예선 결과를 바꾸면 패자부활전·본선이 초기화됩니다. 계속할까요?':d.k==='rep'?'패자부활전 결과를 바꾸면 본선이 초기화됩니다. 계속할까요?':d.k==='f1'?'1차 결과를 바꾸면 순위결정전·최종결승이 초기화됩니다. 계속할까요?':'이후 진행된 단계가 초기화됩니다. 계속할까요?';
    const downHasRes=d.k==='qual'?((L.round.rep&&L.round.rep.heats.some(hasRes))||chainHasRes(L.round.main)):d.k==='rep'?chainHasRes(L.round.main):d.k==='f1'?(chainHasRes(t.finals.upper)||chainHasRes(t.finals.lower)):L.chain.stages.slice(L.si+1).some(s=>s.heats.some(hasRes));
    if(downHasRes&&!(await ask(msg,'초기화하고 변경',true)))return;
  }
  if(reset)reset();
  setVal(t,heat,d.p,v,L.kind);
  autoProgress(t);saveTour(t);
};
ACT.reshuffle=async d=>{
  const t=T(d);const k=d.k;
  if(k==='qual'){const r=t.rounds[+d.r];if((r.qual.heats.some(hasRes)||r.rep||r.main)&&!(await ask('예선 조를 재편성하면 예선 결과와 이후 경기(패자부활전·본선)가 초기화됩니다.','재편성',true)))return;
    const pool=r.qual.heats.flatMap(h=>act(t,h));r.qual={heats:makeGroups(pool,r.size||3).map(newHeat)};r.rep=null;r.main=null;}
  else if(k==='rep'){const r=t.rounds[+d.r];if(r.rep.heats.some(hasRes)&&!(await ask('패자부활전 결과가 초기화됩니다.','재편성',true)))return;const pool=r.rep.heats.flatMap(h=>act(t,h));r.rep={heats:makeGroups(pool,r.repSize||r.size||3).map(newHeat)};r.main=null;}
  else if(k==='main'){const r=t.rounds[+d.r];const ch=r.main;const st=ch.stages[+d.s];if(st.heats.some(hasRes)&&!(await ask('이 단계의 결과가 초기화됩니다.','재편성',true)))return;const pool=st.heats.flatMap(h=>act(t,h));st.heats=makeGroups(pool,ch.size).map(newHeat);ch.stages.splice(+d.s+1);ch.done=false;}
  else if(k==='f1'){const f=t.finals;if(f.stage1.heats.some(hasRes)&&!(await ask('결승라운드 1차 결과가 초기화됩니다.','재편성',true)))return;const pool=f.stage1.heats.flatMap(h=>act(t,h));f.stage1={heats:makeGroups(pool,f.size).map(newHeat)};f.upper=null;f.lower=null;}
  autoProgress(t);saveTour(t);toast('조를 재편성했습니다');
};
ACT.setSize=async d=>{
  const t=T(d);const r=t.rounds[+d.r];const n=+d.v;const k=d.k;
  if(k==='repPre'){r.repSize=n;saveTour(t);return;}
  if(k==='mainPre'){r.mainSize=n;saveTour(t);return;}
  if(k==='qual'){if(r.size===n)return;if(r.qual.heats.some(hasRes)&&!(await ask(`예선을 ${n}인 1조로 다시 편성하면 입력된 예선 결과가 초기화됩니다.`,'다시 편성',true)))return;
    r.size=n;if(!r.repSize||r.repSize===(r.size===3?2:3))r.repSize=n;const pool=r.qual.heats.flatMap(h=>act(t,h));r.qual={heats:makeGroups(pool,n).map(newHeat)};r.rep=null;r.main=null;}
  else if(k==='rep'){if(r.repSize===n&&r.rep)return;if(r.rep.heats.some(hasRes)&&!(await ask(`패자부활전을 ${n}인 1조로 다시 편성하면 결과가 초기화됩니다.`,'다시 편성',true)))return;
    r.repSize=n;const pool=r.rep.heats.flatMap(h=>act(t,h));r.rep={heats:makeGroups(pool,n).map(newHeat)};}
  else if(k==='main'){const ch=r.main;const si=ch.stages.length-1;const st=ch.stages[si];if(ch.size===n)return;
    if(st.heats.some(hasRes)&&!(await ask(`본선 현재 단계를 ${n}인 1조로 다시 편성하면 이 단계 결과가 초기화됩니다.`,'다시 편성',true)))return;
    ch.size=n;r.mainSize=n;const pool=st.heats.flatMap(h=>act(t,h));st.heats=makeGroups(pool,n).map(newHeat);}
  autoProgress(t);saveTour(t);toast(`${n}인 1조로 편성했습니다`);
};
ACT.startRep=d=>{const t=T(d);const r=t.rounds[+d.r];const pool=qualLosers(t,r);if(!pool.length){toast('패자부활전 대상자가 없습니다');return;}r.rep={heats:makeGroups(pool,r.repSize||r.size||3).map(newHeat)};saveTour(t);};
ACT.cancelRep=async d=>{const t=T(d);const r=t.rounds[+d.r];if(r.rep.heats.some(hasRes)&&!(await ask('패자부활전을 취소할까요? 입력된 결과가 삭제됩니다.','취소',true)))return;r.rep=null;saveTour(t);};
ACT.startMain=d=>{
  const t=T(d);const r=t.rounds[+d.r];
  const pool=qualWinners(t,r).concat(r.rep?r.rep.heats.flatMap(x=>winners(t,x)):[]);
  if(!pool.length){toast('본선 진출자가 없습니다. (이 라운드는 결승 진출자 없음)');}
  r.main=chainStart(t,pool,r.mainSize||t.opt.mainSize||3,r.qualCount||2);saveTour(t);
};
ACT.setQC=d=>{const t=T(d);const r=t.rounds[+d.r];const n=+d.v;r.qualCount=n;if(r.main){r.main.N=n;}saveTour(t);};
ACT.nextRound=d=>{const t=T(d);if(startRound(t)){saveTour(t);S.tab[t.id]='r'+(t.rounds.length-1);render();}};
ACT.toFinals=d=>{S.tab[d.t]='fin';const t=S.tours[d.t];if(t&&t.rounds.length<t.opt.rounds){const tt=clone(t);tt.opt.rounds=tt.rounds.length;saveTour(tt);}else render();};
ACT.fsize=d=>{S.tab['fs'+d.t]=+d.v;render();};
ACT.setFSize=async d=>{
  const t=T(d);const f=t.finals;const n=+d.v;
  if(d.k==='f1'){
    if(f.size===n||f.upper)return;
    if(f.stage1.heats.some(hasRes)&&!(await ask(`결승라운드 1차를 ${n}인 1조로 다시 편성하면 입력된 결과가 초기화됩니다.`,'다시 편성',true)))return;
    const pool=f.stage1.heats.flatMap(h=>act(t,h));
    if(pool.length<=3){f.stage1=null;f.upper={size:n,N:null,stages:[{kind:'rank',heats:[newHeat(shuffle(pool))]}],done:false,result:[]};}
    else f.stage1={heats:makeGroups(pool,n).map(newHeat)};
    f.size=n;t.opt.finalSize=n;
  }else{
    const ch=d.k==='up'?f.upper:f.lower;const si=+d.s;const st=ch.stages[si];if(!st||st.kind!=='adv'||ch.size===n)return;
    if(st.heats.some(hasRes)&&!(await ask(`이 단계를 ${n}인 1조로 다시 편성하면 결과가 초기화됩니다.`,'다시 편성',true)))return;
    ch.size=n;const pool=st.heats.flatMap(h=>act(t,h));st.heats=makeGroups(pool,n).map(newHeat);ch.stages.splice(si+1);ch.done=false;
  }
  autoProgress(t);saveTour(t);toast(`${n}인 1조로 편성했습니다`);
};
ACT.makeFinals=d=>{
  const t=T(d);const F=allFinalists(t);if(!F.length)return;
  const size=S.tab['fs'+t.id]||t.opt.finalSize||3;t.opt.finalSize=size;
  const f={size,stage1:null,upper:null,lower:null};
  if(F.length<=3)f.upper={size,N:null,stages:[{kind:'rank',heats:[newHeat(shuffle(F))]}],done:false,result:[]};
  else f.stage1={heats:makeGroups(F,size).map(newHeat)};
  t.finals=f;autoProgress(t);saveTour(t);
};
ACT.resetFinals=async d=>{if(!(await ask('결승라운드 대진과 결과를 모두 초기화할까요?','초기화',true)))return;const t=T(d);t.finals=null;t.result=null;if(t.status==='done')t.status='active';saveTour(t);};

/* 포인트전 */
ACT.cell=d=>{
  const t=S.tours[d.t];const a=d.a,b=d.b;const cur=cellVal(t,a,b);
  openModal(`<h3>${nmHTML(t.people[a])} <span class="muted" style="font-weight:500">vs</span> ${nmHTML(t.people[b])}</h3><div class="small muted" style="margin-bottom:10px">${esc(t.people[a].name)} 기준 결과를 선택하세요</div>
    <div class="opt" style="flex-direction:column">${MOPT.map(o=>`<button class="${cur===o[0]?'on':''}" style="text-align:left;padding:13px 16px;font-size:17px" data-act="setMatch" data-t="${t.id}" data-a="${a}" data-b="${b}" data-v="${o[0]}">${o[1]}${o[0]==='W'?' (2점 / 상대 1점)':o[0]==='L'?' (1점 / 상대 2점)':o[0]==='D'?' (0점 / 상대 2점)':o[0]==='DD'?' (둘 다 0점)':''}</button>`).join('')}</div>
    <div class="mact"><button class="btn" data-act="close">닫기</button></div>`);
};
ACT.setMatch=d=>{
  const t=T(d);const a=d.a,b=d.b,k=mkey(a,b);
  if(t.pts.seeds){toast('본선이 시작되어 수정할 수 없습니다');closeModal();return;}
  const map={W:[ 'W','L'],L:['L','W'],D:['D','W'],DD:['D','D']}[d.v];
  if(!map)delete t.pts.res[k];else t.pts.res[k]={[a]:map[0],[b]:map[1]};
  closeModal();saveTour(t);
};
ACT.tieMv=d=>{
  const t=T(d);const st=standings(t);const i=st.findIndex(s=>s.pid===d.p);const j=i+(+d.v);
  if(j<0||j>=st.length)return;
  if(st[i].pts!==st[j].pts){toast('동점자끼리만 순위를 조정할 수 있습니다. (본선 시작 후 시드 조정 가능)');return;}
  const order=st.map(s=>s.pid);[order[i],order[j]]=[order[j],order[i]];t.pts.tie=order;saveTour(t);
};
ACT.startSurv=async d=>{
  const t=T(d);const n=activeList(t).length;
  if(n<2){toast('참가자가 부족합니다');return;}
  if(playedMatches(t)<totalMatches(t)&&!(await ask(`아직 ${totalMatches(t)-playedMatches(t)}경기가 남았습니다. 현재 순위로 본선을 시작할까요?`,'본선 시작')))return;
  t.pts.seeds=standings(t).map(s=>s.pid);t.pts.heats=[];t.pts.final=null;svProgress(t);S.tab[t.id]='surv';saveTour(t);
};
ACT.seedMv=d=>{const t=T(d);const P=t.pts;const i=P.seeds.indexOf(d.p),j=i+(+d.v);if(j<0||j>=P.seeds.length)return;[P.seeds[i],P.seeds[j]]=[P.seeds[j],P.seeds[i]];P.heats=[];P.final=null;svProgress(t);saveTour(t);};
ACT.resetSurv=async d=>{if(!(await ask('본선 서바이벌을 초기화하고 1단계 리그로 돌아갈까요?','초기화',true)))return;const t=T(d);t.pts.seeds=null;t.pts.heats=[];t.pts.final=null;t.result=null;if(t.status==='done')t.status='active';S.tab[t.id]='league';saveTour(t);};
async function svTruncate(t,idx){
  const P=t.pts;const later=P.heats.slice(idx+1);const has=later.some(h=>h.elim.length)||(P.final&&hasRes(P.final));
  if(has&&!(await ask('이후 진행된 경기 결과가 초기화됩니다. 계속할까요?','초기화하고 변경',true)))return false;
  P.heats.splice(idx+1);P.final=null;return true;
}
function svAdvList(t,h){const a=act(t,h);if(h.adv)return h.adv.filter(p=>a.includes(p));return svHeatDone(t,h)&&h.elim.length?a.filter(p=>!h.elim.includes(p)):[];}
function svApply(t,h){
  const a=act(t,h);const nAdv=Math.max(0,a.length-h.elimCount);
  h.adv=(h.adv||[]).filter(p=>a.includes(p)).slice(0,nAdv);
  if(nAdv>0&&h.adv.length===nAdv){const rest=a.filter(p=>!h.adv.includes(p));if(!(h.elim.length===rest.length&&rest.every(p=>h.elim.includes(p))))h.elim=rest;}
  else h.elim=[];
}
ACT.svAdv=async d=>{
  const t=T(d);const P=t.pts;const idx=P.heats.findIndex(h=>h.id===d.h);const h=P.heats[idx];
  if(!(await svTruncate(t,idx)))return;
  if(!h.adv)h.adv=svAdvList(t,h);
  const a=act(t,h);const nAdv=Math.max(0,a.length-h.elimCount);
  const i=h.adv.indexOf(d.p);
  if(i>=0)h.adv.splice(i,1);
  else{if(h.adv.length>=nAdv){toast(`진출 인원은 ${nAdv}명입니다. 다른 선수를 먼저 해제하세요.`);return;}h.adv.push(d.p);}
  svApply(t,h);svProgress(t);saveTour(t);
};
ACT.svCount=async d=>{const t=T(d);const P=t.pts;const idx=P.heats.findIndex(h=>h.id===d.h);const h=P.heats[idx];if(!(await svTruncate(t,idx)))return;if(!h.adv)h.adv=svAdvList(t,h);h.elimCount=+d.v;svApply(t,h);svProgress(t);saveTour(t);};
ACT.svSwap=async d=>{const t=T(d);const P=t.pts;const idx=P.heats.findIndex(h=>h.id===d.h);const h=P.heats[idx];if(!(await svTruncate(t,idx)))return;h.elim.reverse();svProgress(t);saveTour(t);};
ACT.svReset=async d=>{
  const t=T(d);const P=t.pts;
  if(P.final&&P.final.id===d.h){if(!(await ask('결승 결과를 초기화하고 재경기할까요?','재경기',true)))return;P.final.res={};svProgress(t);saveTour(t);return;}
  const idx=P.heats.findIndex(h=>h.id===d.h);if(idx<0)return;
  if(!(await ask('이 경기와 이후 경기 결과를 초기화하고 재경기할까요?','재경기',true)))return;
  P.heats[idx].elim=[];P.heats[idx].adv=[];P.heats.splice(idx+1);P.final=null;svProgress(t);saveTour(t);
};

/* 대회 관리 */
ACT.editTour=d=>{
  const t=S.tours[d.t];if(!t)return;
  S._et={rounds:t.opt?t.opt.rounds:3,qualCount:t.opt?t.opt.qualCount||2:2,size:t.opt?t.opt.qualSize||3:3,kind:t.kind||'tournament'};

};
function etRender(t){
  const E=S._et;
  const ob=(k,vals,dis)=>`<div class="opt">${vals.map(v=>`<button class="${E[k]===v[0]?'on':''}" ${dis&&dis(v[0])?'disabled':''} data-act="etOpt" data-t="${t.id}" data-k="${k}" data-v="${v[0]}">${v[1]}</button>`).join('')}</div>`;
  const nm=($('#et-name')||{}).value, dt=($('#et-date')||{}).value;
  let body='';
  if(t.type==='tournament'){
    const minR=Math.max(2,t.rounds.length);const fin=!!t.finals;
    body=`<div class="fld"><label>라운드 수 ${fin?'<span class="muted">(결승라운드 진행 중에는 변경 불가)</span>':`<span class="muted">(현재 ${t.rounds.length}라운드 진행)</span>`}</label>${ob('rounds',[[2,'2회'],[3,'3회'],[4,'4회'],[5,'5회']],v=>fin||v<minR)}</div>
      <div class="fld"><label>라운드별 결승라운드 진출 인원 <span class="muted">(진행 중인 라운드 본선과 이후 라운드에 적용)</span></label>${ob('qualCount',[[1,'1명'],[2,'2명']])}</div>
      <div class="fld"><label>조 구성 <span class="muted">(다음에 편성되는 경기부터 적용)</span></label>${ob('size',[[3,'3인 1조'],[2,'2인 1조']])}</div>`;
  }else if(t.type==='record'){

ACT.etSave=d=>{
  const t=T(d);const E=S._et;
  const name=$('#et-name').value.trim();if(!name){toast('대회명을 입력하세요');return;}
  const dv=($('#et-date').value||'').trim();const nd=dv?normDate(dv):t.date;if(!nd){toast('일자를 확인하세요 (예: 2026-11-22)');return;}
  t.name=name;t.date=nd;
  if(t.type==='tournament'){
    if(!t.finals)t.opt.rounds=Math.max(E.rounds,t.rounds.length);
    t.opt.qualCount=E.qualCount;
    const R=t.rounds[t.rounds.length-1];
    if(R&&!t.finals&&(!R.main||!R.main.done)){R.qualCount=E.qualCount;if(R.main)R.main.N=E.qualCount;}
    if(E.size!==t.opt.qualSize){
      t.opt.qualSize=t.opt.mainSize=t.opt.finalSize=E.size;
      if(R&&!t.finals){if(!R.rep)R.repSize=E.size;if(!R.main)R.mainSize=E.size;}
      S.tab['fs'+t.id]=E.size;
    }
    autoProgress(t);
  }else if(t.type==='record'){
    t.kind=E.kind;
    const people={},active=[],result=[];
    (t.result||[]).filter(o=>o.rank>4).forEach(o=>{result.push(o);people[o.pid]=t.people[o.pid]||{name:o.name,nick:o.nick};active.push(o.pid);});
    [1,2,3,4].forEach(r=>{const p=parsePlacer($('#et-p'+r).value);if(!p)return;const old=(t.result||[]).find(o=>o.rank===r&&o.name===p.name&&o.nick===p.nick);const pid=old?old.pid:'r'+r+uid();people[pid]={name:p.name,nick:p.nick};active.push(pid);result.push({pid,rank:r,name:p.name,nick:p.nick,dq:false});});
    result.sort((a,b)=>a.rank-b.rank);t.people=people;t.active=active;t.removed=[];t.result=result;
  }
  S._et=null;closeModal();saveTour(t);toast('대회 정보를 수정했습니다');
};

ACT.saveQR=async d=>{
  const el=document.getElementById(d.q);if(!el){toast('QR을 찾을 수 없습니다');return;}
  const c=el.querySelector('canvas'),img=el.querySelector('img');
  let src=c&&c.width?c:null;
  const pad=24,sz=src?src.width:(img&&img.naturalWidth)||240;
  const out=document.createElement('canvas');out.width=sz+pad*2;out.height=sz+pad*2;const g=out.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,out.width,out.height);
  try{if(src)g.drawImage(src,pad,pad);else if(img)g.drawImage(img,pad,pad,sz,sz);else throw new Error('no qr');}catch(e){toast('QR 이미지를 만들 수 없습니다');return;}
  const qn=(d.n||'QR').replace(/[\\/:*?"<>|]/g,'_')+'.png';const hd=await pickSave(qn);if(hd==='cancel')return;
  out.toBlob(b=>{if(b)saveFile(hd&&hd.name||qn,b,hd);else toast('QR 이미지를 만들 수 없습니다');},'image/png');
};

    <div class="pick" id="pm-add" style="max-height:200px">${others.length?others.map(p=>`<div class="row pmr" data-s="${esc((p.name+' '+p.nick).toLowerCase())}" style="padding:8px 12px;border-bottom:1px solid #f0f1f3">${nmHTML(p)}<span class="sp"></span><button class="btn sm blue" data-act="pmAdd" data-t="${tid}" data-p="${p.id}">추가</button></div>`).join(''):'<div class="empty small">추가할 선수가 없습니다</div>'}</div>
    <div class="mact"><button class="btn pri" data-act="close">완료</button></div>`);
  if(q){const ev=new Event('input',{bubbles:true});$('#pm-q').dispatchEvent(ev);}

function addToTour(t,pid){
  const p=S.players.find(x=>x.id===pid);if(!p)return;
  t.people[pid]={name:p.name,nick:p.nick||'',team:p.team||''};
  if(!t.active.includes(pid))t.active.push(pid);
  t.removed=(t.removed||[]).filter(x=>x!==pid);
  let msg='참가자를 추가했습니다';
  if(t.type==='tournament'&&!t.finals){
    const r=t.rounds[t.rounds.length-1];
    if(r&&!r.main){
      r.rep=null;
      const hs=r.qual.heats;const last=hs[hs.length-1];
      if(last&&act(t,last).length<3)last.players.push(pid);else hs.push(newHeat([pid]));
      msg='현재 라운드 예선에 편성했습니다 (필요시 재편성)';
    }else msg='다음 라운드부터 편성됩니다';
  }else if(t.type==='points'&&t.pts.seeds)msg='본선이 시작되어 리그 기록에만 추가됩니다';
  else if(t.type==='tournament'&&t.finals)msg='결승라운드가 진행 중이라 대진에는 반영되지 않습니다';
  toast(msg);
}
ACT.pmAdd=d=>{const t=T(d);addToTour(t,d.p);autoProgress(t);saveTour(t);pmRender(d.t);};

ACT.pmRestore=d=>{const t=T(d);t.removed=(t.removed||[]).filter(x=>x!==d.p);autoProgress(t);saveTour(t);pmRender(d.t);toast('복귀했습니다');};
ACT.pmText=d=>{
  const t=S.tours[d.t];if(!t)return;
  const mode=S._pmMode||'add';
  openModal(`<h3>참가자 텍스트로 ${mode==='add'?'추가':'제외'}</h3>

    <textarea id="pt-ta" rows="7" style="width:100%;border:1px solid #d5d9df;border-radius:10px;padding:10px 12px;font-size:16px;line-height:1.6" placeholder="이정채, 홍길동\n규아빠">${esc(S._ptTxt||'')}</textarea>

  const ta=$('#pt-ta');

    if(mode==='add'){const miss=es.filter(e=>!matchEntrant(e)).length;$('#pt-cnt').textContent=`${es.length}명 인식 · 명단에 있음 ${es.length-miss}명${miss?` · 명단에 없음 ${miss}명`:''}`;}
    else{const f=es.filter(e=>matchInTour(tt,e)).length;$('#pt-cnt').textContent=`${es.length}명 인식 · 대회 참가자 중 찾음 ${f}명`;}};
  ta.addEventListener('input',upd);upd();setTimeout(()=>ta.focus(),50);
};
function matchInTour(t,e){
  const ids=t.active.filter(p=>t.people[p]);
  const P=p=>t.people[p];
  if(e.nick)return ids.find(p=>P(p).name===e.name&&P(p).nick===e.nick)||ids.find(p=>P(p).nick===e.nick)||null;
  return ids.find(p=>P(p).name===e.name)||ids.find(p=>P(p).nick===e.name)||null;
}
ACT.pmTextMode=d=>{S._pmMode=d.v;ACT.pmText(d);};
ACT.pmTextGo=d=>{
  const es=parseEntrants($('#pt-ta').value);if(!es.length){toast('입력된 선수가 없습니다');return;}
  if((S._pmMode||'add')==='rm'){
    const t=T(d);const hit=[],miss=[];
    es.forEach(e=>{const p=matchInTour(t,e);if(p){if(!hit.includes(p))hit.push(p);}else miss.push(e.raw);});
    if(!hit.length){toast('대회 참가자 중 일치하는 선수가 없습니다');return;}
    hit.forEach(p=>{t.removed=(t.removed||[]).filter(x=>x!==p);t.removed.push(p);});
    autoProgress(t);saveTour(t);S._ptTxt='';pmRender(d.t);
    toast(`${hit.length}명을 제외했습니다${miss.length?` · 못 찾음: ${miss.join(', ')}`:''}`);
    return;
  }
  const found=[],miss=[];es.forEach(e=>{const p=matchEntrant(e);if(p){if(!found.includes(p.id))found.push(p.id);}else miss.push(e);});
  S._ptFound=found;S._ptMiss=miss;
  if(!miss.length){pmTextApply(d.t,false);return;}
  openModal(`<h3>명단에 없는 선수 ${miss.length}명</h3>
    <div>선수 명단에 없는 인원이 있습니다. <b>선수 명단에도 추가하고</b> 대회에 참가시킬까요?</div>
    <div class="pick" style="max-height:220px;margin:10px 0">${miss.map(e=>`<div style="padding:8px 12px;border-bottom:1px solid #f0f1f3">${nmHTML({name:e.name,nick:e.nick||e.name})}</div>`).join('')}</div>
    <div class="small muted">명단에 있는 ${found.length}명은 그대로 추가됩니다.</div>
    <div class="mact"><button class="btn" data-act="pmText" data-t="${d.t}">← 다시 입력</button><button class="btn" data-act="pmTextApply" data-t="${d.t}" data-v="0">추가 안 함 (명단에 있는 선수만)</button><button class="btn pri" data-act="pmTextApply" data-t="${d.t}" data-v="1">선수 추가하고 참가</button></div>`);
};
function pmTextApply(tid,addMissing){
  const ids=S._ptFound.slice();
  if(addMissing&&S._ptMiss.length){
    const list=S.players.slice();
    S._ptMiss.forEach(e=>{const nick=e.nick||e.name;let p=list.find(x=>x.name===e.name&&x.nick===nick);if(!p){p={id:uid(),name:e.name,nick,team:'',memo:''};list.push(p);}if(!ids.includes(p.id))ids.push(p.id);});
    savePlayers(list);
  }
  const t=clone(S.tours[tid]);let n=0;
  ids.forEach(id=>{if(t.active.includes(id)&&isActive(t,id))return;addToTour(t,id);n++;});
  autoProgress(t);saveTour(t);S._ptTxt='';S._ptFound=S._ptMiss=null;pmRender(tid);
  toast(n?`${n}명을 참가자로 추가했습니다`:'이미 참가 중인 선수입니다');
}

function dateField(id,v){return `<div class="row" style="gap:6px;flex-wrap:nowrap"><input id="${id}" value="${esc(v||'')}" placeholder="2026-11-22" inputmode="numeric" autocomplete="off" style="flex:1;min-width:0"><input type="date" id="${id}-p" value="${esc(normDate(v)||'')}" title="달력에서 선택" style="width:46px;flex-shrink:0;padding:8px 4px;color:transparent"></div><div class="small muted" style="margin-top:3px">직접 입력 (예: 2026-11-22, 20261122, 11/22) 또는 오른쪽 달력에서 선택</div>`;}
function normDate(x){
  x=String(x||'').trim();
  const m8=x.match(/^(\d{4})(\d{2})(\d{2})$/);if(m8)return m8[1]+'-'+m8[2]+'-'+m8[3];
  const m4=x.match(/^(\d{2})(\d{2})$/);if(m4)return new Date().getFullYear()+'-'+m4[1]+'-'+m4[2];
  const m=String(x||'').trim().match(/^(\d{4})[.\-\/년\s]+(\d{1,2})[.\-\/월\s]+(\d{1,2})일?\.?$/);
  if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  const m2=String(x||'').trim().match(/^(\d{1,2})[.\-\/월\s]+(\d{1,2})일?\.?$/);
  if(m2)return new Date().getFullYear()+'-'+m2[1].padStart(2,'0')+'-'+m2[2].padStart(2,'0');
  return null;
}
function parseKind(x){x=String(x||'').replace(/\s/g,'').toLowerCase();if(/^(토너먼트|토너|t|tournament)$/.test(x))return 'tournament';if(/^(포인트전|포인트|p|points?)$/.test(x))return 'points';return null;}
function parsePlacer(x){
  x=String(x||'').trim();if(!x||x==='-')return null;
  let name=x,nick='';
  let m=x.match(/^(.+?)\s*[(（](.+?)[)）]$/);
  if(m){name=m[1].trim();nick=m[2].trim();}
  else if(x.indexOf('/')>=0){const f=x.split('/');name=f[0].trim();nick=f.slice(1).join('/').trim();}
  if(!nick){const p=S.players.find(q=>q.name===name)||S.players.find(q=>q.nick===name);if(p){name=p.name;nick=p.nick;}}
  return {name,nick:nick||name};
}
function parseResText(txt){
  const out=[];
  txt.split(/\r?\n/).map(l=>l.trim()).filter(l=>l&&!/^#/.test(l)).forEach(l=>{
    let f=(l.indexOf('\t')>=0?l.split('\t'):l.split(',')).map(x=>x.trim());
    let date=normDate(f[0]);
    if(date)f=f.slice(1);else if(/^(일자|날짜|date)$/i.test(f[0]))return;else date=today();
    const name=f[0];if(!name||/^대회명$/.test(name))return;
    let kind=parseKind(f[1]);let rest=f.slice(1);if(kind)rest=f.slice(2);
    const pl=rest.slice(0,4).map(parsePlacer);
    if(!pl.some(Boolean))return;
    out.push({date,name,kind,pl});
  });
  return out;
}

        const st=pickCol(r,['상태']);
        const kv=parseKind(pickCol(r,['방식','type']));
        tours.push({id,name,date:pickCol(r,['일자','date'])||today(),type:'record',kind:kv||'',status:st==='취소'?'cancelled':'done',createdAt:Date.now(),people,active,removed:[],result});
      });
    }
    if(!tours.length){toast('가져올 대회 결과가 없습니다');return;}
    const over=tours.filter(t=>S.tours[t.id]).length;
    if(!(await ask(`대회 ${tours.length}건을 가져옵니다.${over?`\n(같은 ID ${over}건은 덮어씁니다)`:''}`,'가져오기')))return;
    for(const t of tours){S.tours[t.id]=t;queueWrite('tournaments/'+t.id,{json:JSON.stringify(t),updatedAt:Date.now()});}
    render();ghSchedule();toast(`대회 ${tours.length}건을 가져왔습니다`);
}
ACT.ghPlayers=async()=>{
  try{const r=await fetch('data/players.json',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const list=await r.json();
    const rows=list.map(p=>({name:p.name,nick:p.nick||p.name,team:p.team||'',memo:p.memo||''})).filter(r=>r.name);showImport(rows,'GitHub 백업');}
  catch(e){toast('백업 파일을 읽을 수 없습니다: '+e.message);}
};
/* ================= GitHub 자동 백업 ================= */
const GH_DEF={repo:'intiipu-prog/jjnb_tournermant',branch:'main',token:'',auto:true,last:0,lastErr:''};
function ghCfg(){try{return Object.assign({},GH_DEF,JSON.parse(localStorage.getItem('jjnb:gh')||'{}'));}catch(e){return Object.assign({},GH_DEF);}}
function ghSet(o){try{localStorage.setItem('jjnb:gh',JSON.stringify(Object.assign(ghCfg(),o)));}catch(e){}}
function ghAvail(){return S.mode!=='db';}
function b64(str){const by=new TextEncoder().encode(str);let bin='';for(let i=0;i<by.length;i+=0x8000)bin+=String.fromCharCode.apply(null,by.subarray(i,i+0x8000));return btoa(bin);}
async function ghApi(path,opt){
  const c=ghCfg();
  const r=await fetch('https://api.github.com/repos/'+c.repo+path,Object.assign({},opt,{headers:Object.assign({'Accept':'application/vnd.github+json','Authorization':'Bearer '+c.token,'X-GitHub-Api-Version':'2022-11-28'},(opt||{}).headers||{})}));
  return r;
}
async function ghPut(path,content,msg){
  const c=ghCfg();const enc=b64(content);
  let sha;const g=await ghApi('/contents/'+path.split('/').map(encodeURIComponent).join('/')+'?ref='+encodeURIComponent(c.branch));
  if(g.ok){const j=await g.json();sha=j.sha;if(j.content&&j.content.replace(/\s/g,'')===enc)return false;}
  else if(g.status!==404)throw new Error(ghErrText(g.status));
  const r=await ghApi('/contents/'+path.split('/').map(encodeURIComponent).join('/'),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,content:enc,branch:c.branch,sha})});
  if(!r.ok)throw new Error(ghErrText(r.status));
  return true;
}
function ghErrText(st){return st===401?'토큰이 올바르지 않거나 만료되었습니다':st===403?'토큰에 쓰기 권한(Contents: Read and write)이 없습니다':st===404?'저장소를 찾을 수 없습니다 (토큰의 저장소 선택 확인)':st===409?'저장 충돌 — 잠시 후 다시 시도하세요':'GitHub 오류 '+st;}
function resultsCSV(){
  const q=v=>{v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const nm=o=>o?(o.nick&&o.nick!==o.name?o.name+' / '+o.nick:o.name):'';
  const rows=[['대회ID','대회명','일자','방식','상태','1위','2위','3위','4위','5위~']];
  Object.values(S.tours).filter(t=>t.status==='done'||t.status==='cancelled').sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(t=>{
    const r=t.result||[];const g=k=>nm(r.find(o=>o.rank===k));
    rows.push([t.id,t.name,t.date,kindLabel(tKind(t))||'',t.status==='cancelled'?'취소':'종료',g(1),g(2),g(3),g(4),r.filter(o=>o.rank>4).sort((a,b)=>a.rank-b.rank).map(o=>o.rank+'. '+nm(o)).join('; ')]);
  });
  return '\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')+'\n';
}
let ghTimer=null,ghBusy=false;
function ghSchedule(){
  const c=ghCfg();if(!ghAvail()||!c.token||!c.auto||!S.canWrite)return;
  clearTimeout(ghTimer);ghTimer=setTimeout(()=>ghBackup(false),30000);
}
async function ghBackup(manual){
  const c=ghCfg();if(!c.token){if(manual)toast('먼저 GitHub 토큰을 저장하세요');return;}
  if(ghBusy){ghSchedule();return;}ghBusy=true;
  const stamp=new Date().toLocaleString('ko-KR');
  try{
    const players=JSON.stringify(S.players.map(p=>({id:p.id,name:p.name,nick:p.nick||p.name,team:p.team||'',memo:p.memo||''})),null,0).replace(/\},\{/g,'},\n{');
    const full=JSON.stringify(Object.values(S.tours).sort((a,b)=>(a.date||'').localeCompare(b.date||'')));
    let n=0;
    if(await ghPut('data/players.json',players+'\n',`백업: 선수 명단 ${S.players.length}명 (${stamp})`))n++;
    if(await ghPut('data/tournament_results.csv',resultsCSV(),`백업: 대회 결과 (${stamp})`))n++;
    if(await ghPut('data/tournaments_full.json',full+'\n',`백업: 대회 전체 데이터 ${Object.keys(S.tours).length}건 (${stamp})`))n++;
    ghSet({last:Date.now(),lastErr:''});
    if(manual)toast(n?`GitHub 백업 완료 (${n}개 파일 갱신)`:'GitHub 백업 최신 상태입니다 (변경 없음)');
  }catch(e){ghSet({lastErr:e.message});toast('GitHub 백업 실패: '+e.message);}
  finally{ghBusy=false;if(route()==='config')render();}
}
function ghCardHTML(){
  if(!ghAvail()||!canEdit())return '';
  const c=ghCfg();
  return `<div class="card"><h3>GitHub 자동 백업 <small>${c.token?'연결됨':'미연결'}</small></h3>
    <div class="small muted" style="margin-bottom:10px">선수 명단·대회 결과가 바뀌면 30초 뒤 GitHub 저장소 data/ 폴더에 자동 저장합니다. 토큰은 <b>이 기기 브라우저에만</b> 저장되고 다른 곳에 올라가지 않습니다.</div>
    <div class="fld"><label>저장소 (소유자/이름)</label><input id="gh-repo" value="${esc(c.repo)}"></div>
    <div class="fld"><label>GitHub 토큰 ${c.token?'<span class="muted">(저장됨 · 바꿀 때만 입력)</span>':''}</label><input id="gh-token" type="password" autocomplete="off" placeholder="${c.token?'••••••••':'github_pat_...'}"></div>
    <div class="row" style="margin-bottom:8px"><label class="row small" style="gap:6px;cursor:pointer"><input type="checkbox" id="gh-auto" ${c.auto?'checked':''}> 변경 시 자동 백업</label></div>
    <div class="row"><button class="btn pri sm" data-act="ghSave">저장</button><button class="btn sm" data-act="ghTest">연결 확인</button><button class="btn sm dark" data-act="ghNow">지금 백업</button>${c.token?'<button class="btn sm red" data-act="ghForget">토큰 삭제</button>':''}</div>
    <div class="small muted" style="margin-top:8px">${c.last?'마지막 백업: '+new Date(c.last).toLocaleString('ko-KR'):'아직 백업하지 않았습니다'}${c.lastErr?` · <span style="color:var(--red)">최근 오류: ${esc(c.lastErr)}</span>`:''}</div></div>`;
}
ACT.ghSave=()=>{const o={repo:$('#gh-repo').value.trim()||GH_DEF.repo,auto:$('#gh-auto').checked};const tk=$('#gh-token').value.trim();if(tk)o.token=tk;ghSet(o);render();toast('GitHub 설정을 저장했습니다');};
ACT.ghForget=async()=>{if(!(await ask('이 기기에 저장된 GitHub 토큰을 삭제할까요?','삭제',true)))return;ghSet({token:''});render();};
ACT.ghTest=async()=>{
  const c=ghCfg();if(!c.token){toast('먼저 토큰을 입력하고 저장하세요');return;}
  try{const r=await ghApi('');if(!r.ok)throw new Error(ghErrText(r.status));const j=await r.json();
    toast(j.permissions&&j.permissions.push?`연결 성공: ${j.full_name} (쓰기 가능)`:'연결은 되지만 쓰기 권한이 없습니다');}
  catch(e){toast('연결 실패: '+e.message);}
};
ACT.ghNow=()=>ghBackup(true);

ACT.ghResults=async()=>{
  try{const rf=await fetch('data/tournaments_full.json',{cache:'no-store'});
    if(rf.ok){const arr=await rf.json();if(Array.isArray(arr)&&arr.length){
      const over=arr.filter(t=>S.tours[t.id]).length;
      if(!(await ask(`GitHub 전체 백업에서 대회 ${arr.length}건(조별 대진 포함)을 가져옵니다.${over?`\n(같은 ID ${over}건은 덮어씁니다)`:''}`,'가져오기')))return;
      for(const t of arr){if(t&&t.id){S.tours[t.id]=t;queueWrite('tournaments/'+t.id,{json:JSON.stringify(t),updatedAt:Date.now()});}}
      render();toast(`대회 ${arr.length}건을 가져왔습니다`);return;}}
  }catch(e){}

  try{const r=await fetch('data/tournament_results.csv',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const txt=(await r.text()).replace(/^\ufeff/,'');
    const X=await needXLSX();await importResultsWB(X,X.read(txt,{type:'string'}));}
  catch(e){toast('백업 파일을 읽을 수 없습니다: '+e.message);}
};

/* 진행자 로그인 (Firebase) */
ACT.login=()=>{
  openModal(`<h3>진행자 로그인</h3>
    <div class="fld"><label>이메일</label><input id="lg-email" type="email" autocomplete="username"></div>
    <div class="fld"><label>비밀번호</label><input id="lg-pw" type="password" autocomplete="current-password"></div>
    <div class="mact"><button class="btn" data-act="close">취소</button><button class="btn pri" data-act="doLogin">로그인</button></div>`);
  setTimeout(()=>{const i=$('#lg-email');i&&i.focus();},50);
};
ACT.doLogin=async()=>{
  const em=$('#lg-email').value.trim(),pw=$('#lg-pw').value;
  if(!em||!pw){toast('이메일과 비밀번호를 입력하세요');return;}
  try{await firebase.auth().signInWithEmailAndPassword(em,pw);closeModal();S.viewOnly=false;renderShell();render();toast('로그인했습니다');}
  catch(e){toast(e&&/wrong-password|invalid-credential|user-not-found|invalid-login/.test(e.code||'')?'이메일 또는 비밀번호가 맞지 않습니다':'로그인 실패: '+((e&&e.code)||e));}
};
ACT.logout=async()=>{try{await firebase.auth().signOut();toast('로그아웃했습니다');}catch(e){}};
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='lg-pw')ACT.doLogin();});

renderShell();
initStore();
